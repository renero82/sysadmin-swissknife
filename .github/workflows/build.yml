name: Build macOS app

on:
  push:
    tags: ["v*"]          # a tag like v1.0.0 builds and publishes the release
  workflow_dispatch:      # manual test build from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('sysadmin_swissknife/__init__.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Build app
        run: pyinstaller --noconfirm sysadmin_swissknife.spec

      - name: Selftest
        run: |
          "dist/Sysadmin Swissknife.app/Contents/MacOS/Sysadmin Swissknife" --selftest selftest.txt || { cat selftest.txt; exit 1; }
          cat selftest.txt

      - name: Package
        run: ditto -c -k --keepParent "dist/Sysadmin Swissknife.app" "sysadmin-swissknife-v${VERSION}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: sysadmin-swissknife-macos
          path: sysadmin-swissknife-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sysadmin Swissknife ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: sysadmin-swissknife-*.zip
