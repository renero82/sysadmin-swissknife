name: Build apps

on:
  push:
    tags: ["v*"]          # a tag like v1.1.0 builds and publishes the release
  workflow_dispatch:      # manual test build from the Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        shell: bash
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('sysadmin_swissknife/__init__.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Build app
        run: pyinstaller --noconfirm sysadmin_swissknife.spec

      # ---------------- macOS ----------------
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Sysadmin Swissknife.app/Contents/MacOS/Sysadmin Swissknife" --selftest selftest.txt || { cat selftest.txt; exit 1; }
          cat selftest.txt

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Sysadmin Swissknife.app" "sysadmin-swissknife-v${VERSION}-macos-arm64.zip"

      # ---------------- Windows ----------------
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Sysadmin Swissknife.exe" -ArgumentList "--selftest", "selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "dist/Sysadmin Swissknife.exe" "sysadmin-swissknife-v${VERSION}-windows-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: sysadmin-swissknife-${{ matrix.target }}
          path: |
            sysadmin-swissknife-*.zip
            sysadmin-swissknife-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Sysadmin Swissknife ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: artifacts/*
