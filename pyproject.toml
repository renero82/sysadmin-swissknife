[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sysadmin-swissknife"
version = "1.2.0"
description = "Small network tools for system administrators: visual subnet splitter and IP-in-subnet check"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriele" }]
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5", "pyfiglet>=1.0"]

[project.gui-scripts]
sysadmin-swissknife = "sysadmin_swissknife.gui:main"

[project.urls]
Homepage = "https://github.com/renero82/sysadmin-swissknife"

[tool.setuptools]
packages = ["sysadmin_swissknife"]
